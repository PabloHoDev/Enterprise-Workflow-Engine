# Contas dos testes de integração. O datasource é registrado por TestDatabase.
# Senhas {noop} evitam o custo do BCrypt a cada requisição dos testes; nunca use fora deles.
workflow-engine:
  identity:
    seed-users:
      - username: admin
        display-name: Test Admin
        password: "{noop}admin-secret"
        roles: [ADMIN, USER]
      - username: manager
        password: "{noop}manager-secret"
        roles: [USER, MANAGER]
      - username: finance
        password: "{noop}finance-secret"
        roles: [USER, FINANCE]
      - username: user
        password: "{noop}user-secret"
        roles: [USER]
