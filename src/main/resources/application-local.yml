# Desenvolvimento individual. Com ./mvnw spring-boot:test-run, a URL abaixo é substituída pelo PostgreSQL
# embutido; com ./mvnw spring-boot:run, aponta para o PostgreSQL do docker-compose.yml (ou DB_URL).
# As credenciais abaixo existem apenas para uso local e nunca devem ser usadas em outro ambiente.
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/workflow_engine}
    username: ${DB_USERNAME:workflow}
    password: ${DB_PASSWORD:workflow}

workflow-engine:
  identity:
    # Contas de demonstração, criadas na primeira inicialização (as senhas são gravadas em BCrypt).
    seed-users:
      - username: admin
        display-name: Ana Administradora
        password: workflow-demo-2026
        roles: [ADMIN, USER]
      - username: manager
        display-name: Marcos Gestor
        password: workflow-demo-2026
        roles: [USER, MANAGER]
      - username: finance
        display-name: Fernanda Financeiro
        password: workflow-demo-2026
        roles: [USER, FINANCE]
      - username: user
        display-name: Lucas Solicitante
        password: workflow-demo-2026
        roles: [USER]

logging:
  level:
    com.pablohenrique.workflowengine: DEBUG
