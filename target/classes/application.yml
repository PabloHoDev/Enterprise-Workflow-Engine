# Configuração comum a todos os ambientes. Valores específicos de ambiente e segredos
# chegam por variáveis de ambiente (docs/architecture/DEPLOYMENT.md, DP-002 e DP-003).
spring:
  application:
    name: enterprise-workflow-engine
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  data:
    web:
      pageable:
        max-page-size: 100
  web:
    # Mensagens da API em um único idioma, independentemente do locale do servidor ou do cliente.
    locale: en
    locale-resolver: fixed
  threads:
    virtual:
      enabled: true
  session:
    # Sessões do console web no PostgreSQL (tabelas criadas pelo Flyway, V5).
    timeout: 30m
    jdbc:
      initialize-schema: never

workflow-engine:
  http:
    max-request-size: 256KB

server:
  shutdown: graceful
  servlet:
    session:
      cookie:
        name: EWE_SESSION
        http-only: true
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

logging:
  pattern:
    level: "%5p [%X{requestId:-}]"
