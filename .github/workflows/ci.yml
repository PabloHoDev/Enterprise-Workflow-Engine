name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — testes e quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # CI=true ativa o profile coverage-gate; os testes de integração usam Testcontainers (Docker do runner).
      - name: Build e testes
        run: |
          chmod +x mvnw
          ./mvnw -B verify

      - name: Relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: ignore

  frontend:
    name: Console — lint, tipos, testes e build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Auditoria de dependências de produção
        run: npm audit --omit=dev --audit-level=high

  e2e:
    name: End-to-end (navegador real)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: workflow_engine
          POSTGRES_USER: workflow
          POSTGRES_PASSWORD: workflow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U workflow -d workflow_engine"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build do console
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npx playwright install --with-deps chromium

      - name: Build da aplicação
        run: |
          chmod +x mvnw
          ./mvnw -B -q -DskipTests package

      - name: Sobe a aplicação servindo o console
        run: |
          java -jar target/*.jar --spring.profiles.active=local \
            --workflow-engine.web.console-location=file:frontend/dist/ > app.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/actuator/health/readiness && exit 0
            sleep 2
          done
          cat app.log
          exit 1

      - name: Testes end-to-end
        working-directory: frontend
        run: npx playwright test

      - name: Relatório do Playwright
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            app.log
          if-no-files-found: ignore

  docker:
    name: Imagem Docker
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7

      - name: Build da imagem
        run: docker build -t enterprise-workflow-engine:${{ github.sha }} .
