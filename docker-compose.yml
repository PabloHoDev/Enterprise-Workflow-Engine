# Ambiente local (docs/architecture/DEPLOYMENT.md §16). Não é a definição da infraestrutura de produção.
#
#   docker compose up -d                      -> apenas o PostgreSQL (aplicação via ./mvnw spring-boot:run)
#   docker compose --profile app up --build   -> PostgreSQL + aplicação em container

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: workflow_engine
      POSTGRES_USER: ${DB_USERNAME:-workflow}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-workflow}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-workflow} -d workflow_engine"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    profiles: ["app"]
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_URL: jdbc:postgresql://postgres:5432/workflow_engine
      DB_USERNAME: ${DB_USERNAME:-workflow}
      DB_PASSWORD: ${DB_PASSWORD:-workflow}
    ports:
      - "8080:8080"

volumes:
  postgres-data:
